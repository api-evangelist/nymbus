aid: nymbus
name: Nymbus
description: >-
  Nymbus is a Jacksonville, Florida-based fintech software provider delivering
  cloud-based core banking, digital banking, and account onboarding technology to
  community banks and credit unions. Its Nymbus Connect product exposes a modern
  RESTful API layer alongside a client- and partner-facing developer portal, a
  secure sandbox environment, real-time Kafka event streaming (event-driven
  architecture), and an AWS-based data lake and Redshift data warehouse for
  reporting and analytics. Nymbus is backed by Insight Partners. The public
  developer portal and API reference are gated to authenticated clients and
  partners, so no public OpenAPI specification is available at this time.
